
<style>
*{box-sizing:border-box;margin:0;padding:0}
.wrap{display:flex;gap:0;min-height:520px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;font-family:var(--font-sans)}
.sidebar{width:220px;flex-shrink:0;border-right:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);overflow-y:auto}
.detail{flex:1;background:var(--color-background-primary);overflow-y:auto}
.group-header{padding:8px 12px 4px;font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px}
.tbl-btn{display:block;width:100%;text-align:left;padding:6px 12px 6px 16px;font-size:12px;color:var(--color-text-secondary);background:none;border:none;cursor:pointer;border-left:2px solid transparent;transition:all 0.1s}
.tbl-btn:hover{background:var(--color-background-primary);color:var(--color-text-primary)}
.tbl-btn.active{background:var(--color-background-primary);color:var(--color-text-primary);border-left-color:#1D9E75;font-weight:500}
.detail-empty{display:flex;align-items:center;justify-content:center;height:100%;color:var(--color-text-tertiary);font-size:13px}
.detail-head{padding:16px 18px 10px;border-bottom:0.5px solid var(--color-border-tertiary)}
.detail-tname{font-size:15px;font-weight:500;color:var(--color-text-primary);font-family:var(--font-mono)}
.detail-desc{font-size:12px;color:var(--color-text-secondary);margin-top:3px}
.col-table{width:100%;border-collapse:collapse;font-size:12px}
.col-table th{padding:6px 18px;text-align:left;font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:0.05em;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.col-table td{padding:7px 18px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:top;color:var(--color-text-primary)}
.col-table tr:last-child td{border-bottom:none}
.col-table tr:hover td{background:var(--color-background-secondary)}
.col-name{font-family:var(--font-mono);font-size:11.5px;color:var(--color-text-primary)}
.col-type{font-family:var(--font-mono);font-size:11px;color:#185FA5}
.badge{display:inline-block;font-size:9px;padding:1px 5px;border-radius:3px;font-weight:500;margin-left:4px;vertical-align:middle}
.pk{background:#EAF3DE;color:#27500A}
.fk{background:#E6F1FB;color:#0C447C}
.uq{background:#FAEEDA;color:#633806}
.nn{background:#F1EFE8;color:#444441}
.col-notes{font-size:11px;color:var(--color-text-secondary);line-height:1.4}
.fk-refs{display:block;font-size:10px;color:#185FA5;margin-top:2px;font-family:var(--font-mono)}
@media(prefers-color-scheme:dark){
.pk{background:#173404;color:#C0DD97}
.fk{background:#042C53;color:#B5D4F4}
.uq{background:#412402;color:#FAC775}
.nn{background:#2C2C2A;color:#D3D1C7}
.col-type{color:#85B7EB}
.fk-refs{color:#85B7EB}
}
</style>

<h2 class="sr-only">SQLite database schema explorer — click a table in the sidebar to view its columns</h2>

<div class="wrap">
  <div class="sidebar" id="sidebar"></div>
  <div class="detail" id="detail"><div class="detail-empty">Select a table to view its schema</div></div>
</div>

<script>

          {n:"status",t:"TEXT",badges:["nn"],notes:"'pending' | 'running' | 'success' | 'failed'"},
          {n:"input_preview",t:"TEXT",badges:[],notes:"First 500 chars of raw input"},

const sidebar = document.getElementById('sidebar');
const detail  = document.getElementById('detail');

function renderDetail(table) {
  let html = `<div class="detail-head">
    <div class="detail-tname">${table.name}</div>
    <div class="detail-desc">${table.desc}</div>
  </div>
  <table class="col-table">
    <thead><tr>
      <th style="width:28%">Column</th>
      <th style="width:14%">Type</th>
      <th style="width:20%">Constraints</th>
      <th>Notes</th>
    </tr></thead><tbody>`;

  table.cols.forEach(col => {
    const badges = col.badges.map(b => `<span class="badge ${b}">${b.toUpperCase()}</span>`).join('');
    const ref = col.ref ? `<span class="fk-refs">→ ${col.ref}</span>` : '';
    html += `<tr>
      <td><span class="col-name">${col.n}</span></td>
      <td><span class="col-type">${col.t}</span></td>
      <td>${badges}</td>
      <td><span class="col-notes">${col.notes}${ref}</span></td>
    </tr>`;
  });

  html += `</tbody></table>`;
  detail.innerHTML = html;
}

let activeBtn = null;

schema.forEach(group => {
  const gh = document.createElement('div');
  gh.className = 'group-header';
  gh.textContent = group.group;
  sidebar.appendChild(gh);

  group.tables.forEach(table => {
    const btn = document.createElement('button');
    btn.className = 'tbl-btn';
    btn.textContent = table.name;
    btn.addEventListener('click', () => {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      renderDetail(table);
    });
    sidebar.appendChild(btn);
  });
});
</script>
